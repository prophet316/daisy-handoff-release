name: installer
# Runs on GitHub's hosted macOS and Windows runners, only on pushes to main and when started by hand, never on pull
# requests. (For 0.9.1 the hosted runners were blocked on the account, so it ran on the maintainer's own Windows PC.)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dry run (real OS, throwaway home)
        shell: bash
        run: node install.mjs --dry-run --yes --name Tester --assistant Daisy --home "$RUNNER_TEMP/home"
      - name: Verify the install
        shell: bash
        run: node test/verify-dry-run.mjs "$RUNNER_TEMP/home" daisy-handoff "$(node -p process.platform)"
      - name: Gate, host lane, power switch, who-sent-it, time zone, redaction and bell tests
        if: runner.os == 'macOS'
        shell: bash
        run: cd "$RUNNER_TEMP/home/Projects/daisy-handoff" && ./test.sh gate
      - name: Schedule math in several time zones, redaction and bell startup prompts (every OS)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/home/Projects/daisy-handoff"
          node test/time-unit.mjs
          node worker/redact.mjs --selftest
          node worker/bell-prompts.mjs --selftest
      - name: Refuses to overwrite an install
        shell: bash
        run: "! node install.mjs --dry-run --yes --home \"$RUNNER_TEMP/home\""
      - name: Update in place keeps the keys and the connector URL
        shell: bash
        run: |
          cp "$RUNNER_TEMP/home/Projects/daisy-handoff/.connector-url" "$RUNNER_TEMP/url-before"
          node install.mjs --dry-run --update --home "$RUNNER_TEMP/home"
          cmp "$RUNNER_TEMP/url-before" "$RUNNER_TEMP/home/Projects/daisy-handoff/.connector-url"
          node test/verify-dry-run.mjs "$RUNNER_TEMP/home" daisy-handoff "$(node -p process.platform)"
      - name: Key change makes a new connector URL
        shell: bash
        run: |
          node install.mjs --dry-run --rotate-keys --home "$RUNNER_TEMP/home"
          ! cmp -s "$RUNNER_TEMP/url-before" "$RUNNER_TEMP/home/Projects/daisy-handoff/.connector-url"
      - name: An update that stopped partway keeps your answers on the next try
        shell: bash
        run: node test/update-resume.mjs
      - name: The doctor never sends the key to an address the install didn't deploy
        shell: bash
        run: node test/doctor-no-leak.mjs
      - name: On our own machines, clear what the last run left in this home (hosted runners start clean)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          rm -rf "$HOME/Projects/manual-handoff"
          rm -f "$HOME/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/"*Handoff.cmd
      - name: MANUAL-INSTALL.md step 1 (with --yes and set answers, in the runner's own home)
        shell: bash
        run: |
          node install.mjs --manual --yes --name Tester --assistant Manual
          node test/verify-dry-run.mjs "$(node -p 'require("os").homedir()')" manual-handoff "$(node -p process.platform)"
      - name: Uninstall dry run
        shell: bash
        run: node install.mjs --uninstall --dry-run --home "$RUNNER_TEMP/home"
      - name: Dry run with --no-power-lanes (turned off)
        shell: bash
        run: node install.mjs --dry-run --yes --no-power-lanes --name Tester --assistant Daisy --home "$RUNNER_TEMP/nopower"
      - name: Verify power lanes are off
        shell: bash
        run: node test/verify-dry-run.mjs "$RUNNER_TEMP/nopower" daisy-handoff "$(node -p process.platform)" off
      - name: Dry run with --power-lanes (old flag, still on)
        shell: bash
        run: node install.mjs --dry-run --yes --power-lanes --name Tester --assistant Daisy --home "$RUNNER_TEMP/power"
      - name: Verify power lanes are on
        shell: bash
        run: node test/verify-dry-run.mjs "$RUNNER_TEMP/power" daisy-handoff "$(node -p process.platform)" on
      - name: Dry run with --time-zone (another zone than the runner's)
        shell: bash
        run: node install.mjs --dry-run --yes --time-zone Asia/Kolkata --name Tester --assistant Daisy --home "$RUNNER_TEMP/tz"
      - name: Verify the chosen time zone
        shell: bash
        run: EXPECT_TIME_ZONE=Asia/Kolkata node test/verify-dry-run.mjs "$RUNNER_TEMP/tz" daisy-handoff "$(node -p process.platform)"
      - name: Refuses a made-up time zone
        shell: bash
        run: "! node install.mjs --dry-run --yes --time-zone Mars/Olympus --home \"$RUNNER_TEMP/badtz\""
